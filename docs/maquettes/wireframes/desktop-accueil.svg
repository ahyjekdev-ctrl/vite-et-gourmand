<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box { fill: #FFFFFF; stroke: #9E9E9E; stroke-width: 1.5; }
    .boxg { fill: #E8E8E8; stroke: #9E9E9E; stroke-width: 1.5; }
    .lab { fill: #616161; font-size: 14px; }
    .labB { fill: #424242; font-size: 16px; font-weight: bold; }
    .bar { fill: #D6D6D6; }
    .x { stroke: #BDBDBD; stroke-width: 1.5; }
  </style>
  <rect width="1440" height="1180" fill="#F5F5F5"/>

  <!-- HEADER -->
  <rect class="boxg" x="0" y="0" width="1440" height="80"/>
  <rect class="bar" x="60" y="30" width="180" height="20"/>
  <text x="60" y="22" class="lab" font-size="11">LOGO</text>
  <text x="950" y="48" class="lab">Accueil</text>
  <text x="1050" y="48" class="lab">Nos menus</text>
  <text x="1170" y="48" class="lab">Contact</text>
  <rect class="box" x="1265" y="22" width="120" height="38"/>
  <text x="1325" y="46" class="lab" text-anchor="middle">Connexion</text>

  <!-- HERO -->
  <text x="60" y="130" class="labB">H1 — Présentation de l'entreprise</text>
  <rect class="bar" x="60" y="150" width="540" height="28"/>
  <rect class="bar" x="60" y="190" width="480" height="28"/>
  <rect class="bar" x="60" y="245" width="560" height="12"/>
  <rect class="bar" x="60" y="267" width="500" height="12"/>
  <rect class="boxg" x="60" y="330" width="250" height="52"/>
  <text x="185" y="362" class="lab" text-anchor="middle">CTA → Nos menus</text>
  <rect class="box" x="800" y="120" width="580" height="320"/>
  <line class="x" x1="800" y1="120" x2="1380" y2="440"/>
  <line class="x" x1="1380" y1="120" x2="800" y2="440"/>
  <text x="1090" y="285" class="lab" text-anchor="middle">Image hero</text>

  <!-- ÉQUIPE -->
  <rect class="box" x="0" y="480" width="1440" height="300"/>
  <text x="720" y="540" class="labB" text-anchor="middle">H2 — Professionnalisme de l'équipe</text>
  <rect class="box" x="150" y="595" width="340" height="150"/>
  <text x="320" y="665" class="lab" text-anchor="middle">Carte : 25 ans d'expérience</text>
  <rect class="box" x="550" y="595" width="340" height="150"/>
  <text x="720" y="665" class="lab" text-anchor="middle">Carte : Julie &amp; José</text>
  <rect class="box" x="950" y="595" width="340" height="150"/>
  <text x="1120" y="665" class="lab" text-anchor="middle">Carte : produits frais</text>

  <!-- AVIS -->
  <text x="720" y="850" class="labB" text-anchor="middle">H2 — Avis clients (uniquement validés)</text>
  <rect class="box" x="150" y="900" width="340" height="160"/>
  <text x="175" y="935" class="lab">★★★★★ (note)</text>
  <rect class="bar" x="175" y="955" width="280" height="10"/>
  <rect class="bar" x="175" y="975" width="240" height="10"/>
  <rect class="bar" x="175" y="1015" width="140" height="10"/>
  <rect class="box" x="550" y="900" width="340" height="160"/>
  <text x="720" y="985" class="lab" text-anchor="middle">Avis 2</text>
  <rect class="box" x="950" y="900" width="340" height="160"/>
  <text x="1120" y="985" class="lab" text-anchor="middle">Avis 3</text>

  <!-- FOOTER -->
  <rect class="boxg" x="0" y="1090" width="1440" height="90"/>
  <text x="60" y="1130" class="lab">Horaires (lundi → dimanche)</text>
  <text x="720" y="1130" class="lab" text-anchor="middle">Logo / baseline</text>
  <text x="1380" y="1122" class="lab" text-anchor="end">Mentions légales</text>
  <text x="1380" y="1145" class="lab" text-anchor="end">CGV</text>
</svg>
