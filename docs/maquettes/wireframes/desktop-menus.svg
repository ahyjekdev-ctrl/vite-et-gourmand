<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1150" viewBox="0 0 1440 1150" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <g id="wcard">
      <rect width="300" height="330" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.5"/>
      <rect width="300" height="140" fill="#E8E8E8" stroke="#9E9E9E" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="300" y2="140" stroke="#BDBDBD" stroke-width="1.5"/>
      <line x1="300" y1="0" x2="0" y2="140" stroke="#BDBDBD" stroke-width="1.5"/>
      <rect x="25" y="165" width="200" height="16" fill="#D6D6D6"/>
      <rect x="25" y="195" width="250" height="10" fill="#E0E0E0"/>
      <rect x="25" y="213" width="220" height="10" fill="#E0E0E0"/>
      <rect x="25" y="240" width="90" height="26" fill="none" stroke="#9E9E9E"/>
      <rect x="200" y="240" width="75" height="20" fill="#D6D6D6"/>
      <rect x="25" y="280" width="250" height="38" fill="#E8E8E8" stroke="#9E9E9E"/>
    </g>
  </defs>
  <style>
    .box { fill: #FFFFFF; stroke: #9E9E9E; stroke-width: 1.5; }
    .boxg { fill: #E8E8E8; stroke: #9E9E9E; stroke-width: 1.5; }
    .lab { fill: #616161; font-size: 14px; }
    .labB { fill: #424242; font-size: 16px; font-weight: bold; }
    .lab-s { fill: #757575; font-size: 12px; }
    .bar { fill: #D6D6D6; }
  </style>
  <rect width="1440" height="1150" fill="#F5F5F5"/>

  <!-- HEADER -->
  <rect class="boxg" x="0" y="0" width="1440" height="80"/>
  <rect class="bar" x="60" y="30" width="180" height="20"/>
  <text x="950" y="48" class="lab">Accueil</text>
  <text x="1050" y="48" class="lab">Nos menus</text>
  <text x="1170" y="48" class="lab">Contact</text>
  <rect class="box" x="1265" y="22" width="120" height="38"/>
  <text x="1325" y="46" class="lab" text-anchor="middle">Connexion</text>

  <text x="60" y="140" class="labB">H1 — Nos menus (vue globale, accessible sans connexion)</text>
  <text x="60" y="168" class="lab-s">Compteur de résultats — actualisation dynamique (sans rechargement)</text>

  <!-- FILTRES -->
  <rect class="box" x="60" y="200" width="300" height="640"/>
  <text x="85" y="235" class="labB">Filtres</text>
  <text x="85" y="275" class="lab-s">Prix maximum</text>
  <rect class="bar" x="85" y="290" width="250" height="8"/>
  <circle cx="245" cy="294" r="9" fill="#9E9E9E"/>
  <text x="85" y="350" class="lab-s">Fourchette de prix</text>
  <rect class="box" x="85" y="365" width="115" height="40"/>
  <rect class="box" x="220" y="365" width="115" height="40"/>
  <text x="85" y="445" class="lab-s">Thème (liste déroulante)</text>
  <rect class="box" x="85" y="460" width="250" height="40"/>
  <text x="320" y="486" class="lab" text-anchor="end">▾</text>
  <text x="85" y="540" class="lab-s">Régime (liste déroulante)</text>
  <rect class="box" x="85" y="555" width="250" height="40"/>
  <text x="320" y="581" class="lab" text-anchor="end">▾</text>
  <text x="85" y="635" class="lab-s">Nb personnes minimum</text>
  <rect class="box" x="85" y="650" width="250" height="40"/>
  <rect class="boxg" x="85" y="730" width="250" height="44"/>
  <text x="210" y="758" class="lab" text-anchor="middle">Réinitialiser</text>

  <!-- GRILLE -->
  <use href="#wcard" x="400" y="200"/>
  <use href="#wcard" x="740" y="200"/>
  <use href="#wcard" x="1080" y="200"/>
  <use href="#wcard" x="400" y="560"/>
  <use href="#wcard" x="740" y="560"/>
  <use href="#wcard" x="1080" y="560"/>
  <text x="550" y="545" class="lab-s" text-anchor="middle">titre · description · nb pers. min · prix · bouton détail</text>

  <!-- FOOTER -->
  <rect class="boxg" x="0" y="1060" width="1440" height="90"/>
  <text x="60" y="1100" class="lab">Horaires (lundi → dimanche)</text>
  <text x="720" y="1100" class="lab" text-anchor="middle">Logo / baseline</text>
  <text x="1380" y="1092" class="lab" text-anchor="end">Mentions légales</text>
  <text x="1380" y="1115" class="lab" text-anchor="end">CGV</text>
</svg>
