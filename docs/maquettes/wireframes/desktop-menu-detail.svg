<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1330" viewBox="0 0 1440 1330" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box { fill: #FFFFFF; stroke: #9E9E9E; stroke-width: 1.5; }
    .boxg { fill: #E8E8E8; stroke: #9E9E9E; stroke-width: 1.5; }
    .lab { fill: #616161; font-size: 14px; }
    .labB { fill: #424242; font-size: 16px; font-weight: bold; }
    .lab-s { fill: #757575; font-size: 12px; }
    .bar { fill: #D6D6D6; }
    .x { stroke: #BDBDBD; stroke-width: 1.5; }
  </style>
  <rect width="1440" height="1330" fill="#F5F5F5"/>

  <!-- HEADER -->
  <rect class="boxg" x="0" y="0" width="1440" height="80"/>
  <rect class="bar" x="60" y="30" width="180" height="20"/>
  <text x="950" y="48" class="lab">Accueil</text>
  <text x="1050" y="48" class="lab">Nos menus</text>
  <text x="1170" y="48" class="lab">Contact</text>
  <rect class="box" x="1265" y="22" width="120" height="38"/>
  <text x="1325" y="46" class="lab" text-anchor="middle">Connexion</text>

  <text x="60" y="120" class="lab-s">Fil d'Ariane : Accueil › Nos menus › [titre du menu]</text>

  <!-- GALERIE -->
  <rect class="box" x="60" y="145" width="620" height="380"/>
  <line class="x" x1="60" y1="145" x2="680" y2="525"/>
  <line class="x" x1="680" y1="145" x2="60" y2="525"/>
  <text x="370" y="340" class="lab" text-anchor="middle">Image principale</text>
  <rect class="box" x="60" y="545" width="196" height="110"/>
  <rect class="box" x="272" y="545" width="196" height="110"/>
  <rect class="box" x="484" y="545" width="196" height="110"/>
  <text x="370" y="680" class="lab-s" text-anchor="middle">Galerie d'images (vignettes)</text>

  <!-- INFOS -->
  <text x="740" y="175" class="labB">H1 — Titre du menu</text>
  <rect class="bar" x="740" y="190" width="380" height="24"/>
  <rect class="box" x="740" y="230" width="130" height="30"/>
  <text x="805" y="250" class="lab-s" text-anchor="middle">Badge thème</text>
  <rect class="box" x="885" y="230" width="150" height="30"/>
  <text x="960" y="250" class="lab-s" text-anchor="middle">Badge régime</text>
  <rect class="bar" x="740" y="285" width="600" height="12"/>
  <rect class="bar" x="740" y="307" width="560" height="12"/>
  <rect class="bar" x="740" y="329" width="520" height="12"/>

  <rect class="box" x="740" y="365" width="640" height="110"/>
  <text x="770" y="405" class="labB">Prix (pour nb pers. minimum)</text>
  <text x="770" y="435" class="lab-s">Badge réduction −10 % (min + 5 pers.)</text>
  <text x="1350" y="435" class="lab-s" text-anchor="end">Stock restant</text>

  <rect class="box" x="740" y="495" width="640" height="120"/>
  <rect x="740" y="495" width="6" height="120" fill="#757575"/>
  <text x="770" y="530" class="labB">⚠ CONDITIONS DU MENU — mise en évidence obligatoire</text>
  <rect class="bar" x="770" y="550" width="560" height="10"/>
  <rect class="bar" x="770" y="575" width="480" height="10"/>

  <rect class="boxg" x="740" y="640" width="300" height="54"/>
  <text x="890" y="673" class="lab" text-anchor="middle">CTA — Commander ce menu</text>
  <text x="1070" y="673" class="lab-s">(visiteur → redirection connexion)</text>

  <!-- COMPOSITION -->
  <rect class="box" x="0" y="730" width="1440" height="440"/>
  <text x="720" y="790" class="labB" text-anchor="middle">H2 — Composition du menu (plats + allergènes)</text>
  <rect class="box" x="100" y="845" width="380" height="280"/>
  <text x="290" y="880" class="lab" text-anchor="middle">Entrées</text>
  <rect class="bar" x="130" y="905" width="300" height="12"/>
  <rect class="box" x="130" y="930" width="70" height="22"/>
  <rect class="box" x="210" y="930" width="70" height="22"/>
  <text x="290" y="990" class="lab-s" text-anchor="middle">liste des plats + pastilles allergènes</text>
  <rect class="box" x="530" y="845" width="380" height="280"/>
  <text x="720" y="880" class="lab" text-anchor="middle">Plats</text>
  <rect class="box" x="960" y="845" width="380" height="280"/>
  <text x="1150" y="880" class="lab" text-anchor="middle">Desserts</text>

  <!-- FOOTER -->
  <rect class="boxg" x="0" y="1240" width="1440" height="90"/>
  <text x="60" y="1280" class="lab">Horaires (lundi → dimanche)</text>
  <text x="720" y="1280" class="lab" text-anchor="middle">Logo / baseline</text>
  <text x="1380" y="1272" class="lab" text-anchor="end">Mentions légales</text>
  <text x="1380" y="1295" class="lab" text-anchor="end">CGV</text>
</svg>
