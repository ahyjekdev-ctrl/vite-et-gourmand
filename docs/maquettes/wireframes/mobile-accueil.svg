<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1300" viewBox="0 0 375 1300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box { fill: #FFFFFF; stroke: #9E9E9E; stroke-width: 1.5; }
    .boxg { fill: #E8E8E8; stroke: #9E9E9E; stroke-width: 1.5; }
    .lab { fill: #616161; font-size: 13px; }
    .labB { fill: #424242; font-size: 14px; font-weight: bold; }
    .lab-s { fill: #757575; font-size: 11px; }
    .bar { fill: #D6D6D6; }
    .x { stroke: #BDBDBD; stroke-width: 1.5; }
  </style>
  <rect width="375" height="1300" fill="#F5F5F5"/>

  <!-- HEADER -->
  <rect class="boxg" x="0" y="0" width="375" height="64"/>
  <rect x="20" y="24" width="24" height="3" fill="#757575"/>
  <rect x="20" y="31" width="24" height="3" fill="#757575"/>
  <rect x="20" y="38" width="24" height="3" fill="#757575"/>
  <text x="18" y="18" class="lab-s">burger</text>
  <rect class="bar" x="130" y="24" width="115" height="16"/>
  <circle cx="343" cy="32" r="12" fill="none" stroke="#757575" stroke-width="1.5"/>
  <text x="355" y="18" class="lab-s" text-anchor="end">compte</text>

  <!-- HERO -->
  <text x="187" y="105" class="labB" text-anchor="middle">H1 — Présentation entreprise</text>
  <rect class="bar" x="60" y="125" width="255" height="18"/>
  <rect class="bar" x="85" y="155" width="205" height="12"/>
  <rect class="box" x="27" y="190" width="321" height="180"/>
  <line class="x" x1="27" y1="190" x2="348" y2="370"/>
  <line class="x" x1="348" y1="190" x2="27" y2="370"/>
  <text x="187" y="285" class="lab" text-anchor="middle">Image hero</text>
  <rect class="boxg" x="27" y="395" width="321" height="50"/>
  <text x="187" y="426" class="lab" text-anchor="middle">CTA → Nos menus</text>

  <!-- ÉQUIPE -->
  <text x="187" y="510" class="labB" text-anchor="middle">H2 — Professionnalisme équipe</text>
  <rect class="box" x="27" y="535" width="321" height="115"/>
  <text x="187" y="597" class="lab" text-anchor="middle">Carte 1 (empilée)</text>
  <rect class="box" x="27" y="665" width="321" height="115"/>
  <text x="187" y="727" class="lab" text-anchor="middle">Carte 2 (empilée)</text>

  <!-- AVIS -->
  <text x="187" y="845" class="labB" text-anchor="middle">H2 — Avis clients validés</text>
  <rect class="box" x="27" y="870" width="321" height="130"/>
  <text x="50" y="900" class="lab">★★★★★</text>
  <rect class="bar" x="50" y="920" width="270" height="10"/>
  <rect class="bar" x="50" y="940" width="230" height="10"/>
  <rect class="bar" x="50" y="970" width="130" height="10"/>
  <circle cx="167" cy="1030" r="4" fill="#757575"/>
  <circle cx="187" cy="1030" r="4" fill="#D6D6D6"/>
  <circle cx="207" cy="1030" r="4" fill="#D6D6D6"/>
  <text x="187" y="1060" class="lab-s" text-anchor="middle">carrousel — 1 avis à la fois</text>

  <!-- FOOTER -->
  <rect class="boxg" x="0" y="1100" width="375" height="200"/>
  <text x="27" y="1135" class="lab">Horaires (lundi → dimanche)</text>
  <rect class="bar" x="27" y="1150" width="230" height="10"/>
  <rect class="bar" x="27" y="1170" width="180" height="10"/>
  <text x="27" y="1215" class="lab">Mentions légales</text>
  <text x="27" y="1245" class="lab">CGV</text>
</svg>
