<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1400" viewBox="0 0 375 1400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2D2A26" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .txt   { fill: #2D2A26; }
    .mut   { fill: #6B645C; }
    .blanc { fill: #FFFFFF; }
    .pill  { fill: #F0EAE0; }
  </style>

  <rect width="375" height="1400" fill="#FAF4EA"/>

  <!-- ===== HEADER MOBILE ===== -->
  <rect width="375" height="64" fill="#7B2D35"/>
  <text x="30" y="42" class="blanc" font-size="20">‹</text>
  <text x="187" y="40" class="serif blanc" font-size="18" font-style="italic" font-weight="bold" text-anchor="middle">Vite &amp; Gourmand</text>
  <circle cx="343" cy="28" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 331 45 Q 343 34 355 45" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- ===== GALERIE ===== -->
  <rect x="0" y="64" width="375" height="230" fill="#EAD9C2"/>
  <circle cx="187" cy="170" r="55" fill="#FAF4EA" stroke="#C99B3F" stroke-width="2.5"/>
  <circle cx="187" cy="170" r="40" fill="#FFFFFF" stroke="#E4CFA6" stroke-width="2"/>
  <!-- Points carrousel galerie -->
  <circle cx="167" cy="275" r="4" fill="#7B2D35"/>
  <circle cx="187" cy="275" r="4" fill="#FFFFFF"/>
  <circle cx="207" cy="275" r="4" fill="#FFFFFF"/>

  <!-- ===== INFOS ===== -->
  <text x="27" y="340" class="serif txt" font-size="24" font-weight="bold">Menu Noël Prestige</text>
  <rect x="27" y="358" width="110" height="26" rx="13" fill="#7B2D35"/>
  <text x="82" y="376" class="blanc" font-size="12" text-anchor="middle">Thème : Noël</text>
  <rect x="147" y="358" width="130" height="26" rx="13" fill="none" stroke="#7B2D35" stroke-width="1.5"/>
  <text x="212" y="376" font-size="12" fill="#7B2D35" text-anchor="middle">Régime : classique</text>

  <text x="27" y="415" class="txt" font-size="13">Un menu d'exception pour les fêtes : foie gras</text>
  <text x="27" y="434" class="txt" font-size="13">mi-cuit, chapon fermier aux morilles et sa purée</text>
  <text x="27" y="453" class="txt" font-size="13">truffée, bûche signature chocolat-praliné.</text>

  <!-- Bloc prix -->
  <rect x="27" y="478" width="321" height="112" rx="12" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="47" y="518" class="serif" font-size="24" font-weight="bold" fill="#7B2D35">320 €</text>
  <text x="130" y="518" class="mut" font-size="13">pour 8 personnes (min.)</text>
  <rect x="47" y="532" width="215" height="24" rx="12" fill="#C99B3F"/>
  <text x="154" y="549" font-size="11" font-weight="bold" fill="#2D2A26" text-anchor="middle">−10 % à partir de 13 personnes</text>
  <text x="47" y="578" class="mut" font-size="12">⏳ Plus que 5 commandes disponibles</text>

  <!-- Encart conditions -->
  <rect x="27" y="610" width="321" height="130" rx="8" fill="#FBEFEA"/>
  <rect x="27" y="610" width="5" height="130" fill="#B3261E"/>
  <text x="50" y="640" font-size="13" font-weight="bold" fill="#B3261E">⚠ Conditions de ce menu</text>
  <text x="50" y="668" class="txt" font-size="12">• Commande au minimum 7 jours avant</text>
  <text x="50" y="686" class="txt" font-size="12">la date de la prestation.</text>
  <text x="50" y="710" class="txt" font-size="12">• Conservation au frais entre 0 et 4 °C.</text>

  <!-- ===== COMPOSITION ===== -->
  <text x="187" y="785" class="serif txt" font-size="20" font-weight="bold" text-anchor="middle">Composition du menu</text>
  <rect x="147" y="798" width="80" height="3" fill="#C99B3F"/>

  <rect x="27" y="820" width="321" height="130" rx="12" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="47" y="852" class="serif" font-size="16" font-weight="bold" fill="#7B2D35">Entrées</text>
  <text x="47" y="880" class="txt" font-size="13" font-weight="bold">Foie gras mi-cuit, chutney de figues</text>
  <rect x="47" y="893" width="56" height="20" rx="10" class="pill"/>
  <text x="75" y="907" class="mut" font-size="10" text-anchor="middle">lactose</text>
  <rect x="109" y="893" width="52" height="20" rx="10" class="pill"/>
  <text x="135" y="907" class="mut" font-size="10" text-anchor="middle">gluten</text>
  <text x="47" y="935" class="txt" font-size="13" font-weight="bold">Velouté de châtaignes</text>

  <rect x="27" y="970" width="321" height="110" rx="12" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="47" y="1002" class="serif" font-size="16" font-weight="bold" fill="#7B2D35">Plats</text>
  <text x="47" y="1030" class="txt" font-size="13" font-weight="bold">Chapon fermier aux morilles</text>
  <rect x="47" y="1043" width="56" height="20" rx="10" class="pill"/>
  <text x="75" y="1057" class="mut" font-size="10" text-anchor="middle">lactose</text>

  <rect x="27" y="1100" width="321" height="110" rx="12" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="47" y="1132" class="serif" font-size="16" font-weight="bold" fill="#7B2D35">Desserts</text>
  <text x="47" y="1160" class="txt" font-size="13" font-weight="bold">Bûche signature chocolat-praliné</text>
  <rect x="47" y="1173" width="52" height="20" rx="10" class="pill"/>
  <text x="73" y="1187" class="mut" font-size="10" text-anchor="middle">gluten</text>
  <rect x="105" y="1173" width="56" height="20" rx="10" class="pill"/>
  <text x="133" y="1187" class="mut" font-size="10" text-anchor="middle">lactose</text>

  <!-- ===== BARRE CTA FIXE (sticky bottom) ===== -->
  <rect x="0" y="1320" width="375" height="80" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="27" y="1352" class="serif" font-size="18" font-weight="bold" fill="#7B2D35">320 €</text>
  <text x="27" y="1372" class="mut" font-size="11">pour 8 personnes</text>
  <rect x="150" y="1338" width="198" height="46" rx="8" fill="#7B2D35"/>
  <text x="249" y="1367" class="blanc" font-size="15" font-weight="bold" text-anchor="middle">Commander</text>
</svg>
