<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1150" viewBox="0 0 1440 1150" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2D2A26" flood-opacity="0.12"/>
    </filter>
    <!-- Carte menu réutilisable -->
    <g id="carte">
      <rect width="300" height="330" rx="12" fill="#FFFFFF" filter="url(#sh)"/>
      <rect width="300" height="140" rx="12" fill="#EAD9C2"/>
      <rect y="128" width="300" height="12" fill="#FFFFFF"/>
      <circle cx="150" cy="70" r="34" fill="#FAF4EA" stroke="#C99B3F" stroke-width="2"/>
    </g>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .txt   { fill: #2D2A26; }
    .mut   { fill: #6B645C; }
    .blanc { fill: #FFFFFF; }
    .lab   { fill: #2D2A26; font-size: 13px; font-weight: bold; }
    .champ { fill: #FFFFFF; stroke: #C9C2B8; stroke-width: 1.5; }
  </style>

  <rect width="1440" height="1150" fill="#FAF4EA"/>

  <!-- ===== HEADER ===== -->
  <rect width="1440" height="80" fill="#7B2D35"/>
  <text x="60" y="50" class="serif blanc" font-size="26" font-style="italic" font-weight="bold">Vite &amp; Gourmand</text>
  <text x="950" y="48" class="blanc" font-size="16">Accueil</text>
  <text x="1050" y="48" class="blanc" font-size="16" font-weight="bold">Nos menus</text>
  <rect x="1045" y="58" width="83" height="3" fill="#C99B3F"/>
  <text x="1175" y="48" class="blanc" font-size="16">Contact</text>
  <rect x="1265" y="22" width="120" height="38" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="1325" y="46" class="blanc" font-size="15" text-anchor="middle">Connexion</text>

  <!-- ===== TITRE ===== -->
  <text x="60" y="145" class="serif txt" font-size="36" font-weight="bold">Nos menus</text>
  <text x="60" y="175" class="mut" font-size="15">6 menus correspondent à votre recherche — résultats mis à jour sans rechargement</text>

  <!-- ===== FILTRES (barre latérale) ===== -->
  <rect x="60" y="200" width="300" height="640" rx="12" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="85" y="240" class="serif txt" font-size="20" font-weight="bold">Filtres</text>

  <text x="85" y="285" class="lab">Prix maximum</text>
  <rect x="85" y="300" width="250" height="6" rx="3" fill="#E4DCD0"/>
  <rect x="85" y="300" width="160" height="6" rx="3" fill="#7B2D35"/>
  <circle cx="245" cy="303" r="10" fill="#7B2D35"/>
  <text x="335" y="330" class="mut" font-size="13" text-anchor="end">350 €</text>

  <text x="85" y="375" class="lab">Fourchette de prix</text>
  <rect x="85" y="390" width="115" height="40" rx="8" class="champ"/>
  <text x="100" y="415" class="mut" font-size="13">Min €</text>
  <rect x="220" y="390" width="115" height="40" rx="8" class="champ"/>
  <text x="235" y="415" class="mut" font-size="13">Max €</text>

  <text x="85" y="475" class="lab">Thème</text>
  <rect x="85" y="490" width="250" height="40" rx="8" class="champ"/>
  <text x="100" y="515" class="txt" font-size="14">Tous les thèmes</text>
  <text x="320" y="516" class="mut" font-size="12" text-anchor="end">▾</text>

  <text x="85" y="575" class="lab">Régime</text>
  <rect x="85" y="590" width="250" height="40" rx="8" class="champ"/>
  <text x="100" y="615" class="txt" font-size="14">Tous les régimes</text>
  <text x="320" y="616" class="mut" font-size="12" text-anchor="end">▾</text>

  <text x="85" y="675" class="lab">Nombre de personnes minimum</text>
  <rect x="85" y="690" width="250" height="40" rx="8" class="champ"/>
  <text x="100" y="715" class="txt" font-size="14">8</text>

  <rect x="85" y="765" width="250" height="44" rx="8" fill="none" stroke="#7B2D35" stroke-width="2"/>
  <text x="210" y="793" font-size="15" font-weight="bold" fill="#7B2D35" text-anchor="middle">Réinitialiser les filtres</text>

  <!-- ===== GRILLE DES MENUS (2 rangées × 3) ===== -->
  <!-- Rangée 1 -->
  <use href="#carte" x="400" y="200"/>
  <text x="425" y="375" class="serif txt" font-size="18" font-weight="bold">Menu Noël Prestige</text>
  <text x="425" y="400" class="mut" font-size="13">Foie gras, chapon aux morilles,</text>
  <text x="425" y="418" class="mut" font-size="13">bûche signature maison.</text>
  <rect x="425" y="440" width="90" height="26" rx="13" fill="#FAF4EA" stroke="#C99B3F"/>
  <text x="470" y="458" class="txt" font-size="12" text-anchor="middle">≥ 8 pers.</text>
  <text x="675" y="460" class="serif" font-size="20" font-weight="bold" fill="#7B2D35" text-anchor="end">320 €</text>
  <rect x="425" y="480" width="250" height="38" rx="8" fill="#7B2D35"/>
  <text x="550" y="504" class="blanc" font-size="14" font-weight="bold" text-anchor="middle">Voir le détail</text>

  <use href="#carte" x="740" y="200"/>
  <text x="765" y="375" class="serif txt" font-size="18" font-weight="bold">Menu Pâques Gourmand</text>
  <text x="765" y="400" class="mut" font-size="13">Agneau de sept heures, légumes</text>
  <text x="765" y="418" class="mut" font-size="13">printaniers, nid chocolaté.</text>
  <rect x="765" y="440" width="90" height="26" rx="13" fill="#FAF4EA" stroke="#C99B3F"/>
  <text x="810" y="458" class="txt" font-size="12" text-anchor="middle">≥ 6 pers.</text>
  <text x="1015" y="460" class="serif" font-size="20" font-weight="bold" fill="#7B2D35" text-anchor="end">180 €</text>
  <rect x="765" y="480" width="250" height="38" rx="8" fill="#7B2D35"/>
  <text x="890" y="504" class="blanc" font-size="14" font-weight="bold" text-anchor="middle">Voir le détail</text>

  <use href="#carte" x="1080" y="200"/>
  <text x="1105" y="375" class="serif txt" font-size="18" font-weight="bold">Menu Classique Bordelais</text>
  <text x="1105" y="400" class="mut" font-size="13">Entrecôte à la bordelaise,</text>
  <text x="1105" y="418" class="mut" font-size="13">cannelés et douceurs locales.</text>
  <rect x="1105" y="440" width="90" height="26" rx="13" fill="#FAF4EA" stroke="#C99B3F"/>
  <text x="1150" y="458" class="txt" font-size="12" text-anchor="middle">≥ 6 pers.</text>
  <text x="1355" y="460" class="serif" font-size="20" font-weight="bold" fill="#7B2D35" text-anchor="end">150 €</text>
  <rect x="1105" y="480" width="250" height="38" rx="8" fill="#7B2D35"/>
  <text x="1230" y="504" class="blanc" font-size="14" font-weight="bold" text-anchor="middle">Voir le détail</text>

  <!-- Rangée 2 -->
  <use href="#carte" x="400" y="560"/>
  <text x="425" y="735" class="serif txt" font-size="18" font-weight="bold">Menu Végétarien du Marché</text>
  <text x="425" y="760" class="mut" font-size="13">Légumes rôtis, risotto crémeux,</text>
  <text x="425" y="778" class="mut" font-size="13">tarte fine aux fruits de saison.</text>
  <rect x="425" y="800" width="90" height="26" rx="13" fill="#FAF4EA" stroke="#C99B3F"/>
  <text x="470" y="818" class="txt" font-size="12" text-anchor="middle">≥ 6 pers.</text>
  <text x="675" y="820" class="serif" font-size="20" font-weight="bold" fill="#7B2D35" text-anchor="end">140 €</text>
  <rect x="425" y="840" width="250" height="38" rx="8" fill="#7B2D35"/>
  <text x="550" y="864" class="blanc" font-size="14" font-weight="bold" text-anchor="middle">Voir le détail</text>

  <use href="#carte" x="740" y="560"/>
  <text x="765" y="735" class="serif txt" font-size="18" font-weight="bold">Menu Vegan Découverte</text>
  <text x="765" y="760" class="mut" font-size="13">Houmos de saison, curry coco,</text>
  <text x="765" y="778" class="mut" font-size="13">pavlova végétale aux fruits rouges.</text>
  <rect x="765" y="800" width="90" height="26" rx="13" fill="#FAF4EA" stroke="#C99B3F"/>
  <text x="810" y="818" class="txt" font-size="12" text-anchor="middle">≥ 6 pers.</text>
  <text x="1015" y="820" class="serif" font-size="20" font-weight="bold" fill="#7B2D35" text-anchor="end">145 €</text>
  <rect x="765" y="840" width="250" height="38" rx="8" fill="#7B2D35"/>
  <text x="890" y="864" class="blanc" font-size="14" font-weight="bold" text-anchor="middle">Voir le détail</text>

  <use href="#carte" x="1080" y="560"/>
  <text x="1105" y="735" class="serif txt" font-size="18" font-weight="bold">Menu Évènement Grand Format</text>
  <text x="1105" y="760" class="mut" font-size="13">Buffet complet pour réceptions,</text>
  <text x="1105" y="778" class="mut" font-size="13">mariages et séminaires.</text>
  <rect x="1105" y="800" width="98" height="26" rx="13" fill="#FAF4EA" stroke="#C99B3F"/>
  <text x="1154" y="818" class="txt" font-size="12" text-anchor="middle">≥ 20 pers.</text>
  <text x="1355" y="820" class="serif" font-size="20" font-weight="bold" fill="#7B2D35" text-anchor="end">550 €</text>
  <rect x="1105" y="840" width="250" height="38" rx="8" fill="#7B2D35"/>
  <text x="1230" y="864" class="blanc" font-size="14" font-weight="bold" text-anchor="middle">Voir le détail</text>

  <!-- ===== FOOTER ===== -->
  <rect y="1060" width="1440" height="90" fill="#5E2129"/>
  <text x="60" y="1098" class="blanc" font-size="14" font-weight="bold">Horaires</text>
  <text x="60" y="1122" fill="#E8D5D0" font-size="13">Lun – Ven : 9h – 19h · Sam : 9h – 20h · Dim : 10h – 16h</text>
  <text x="720" y="1098" class="serif blanc" font-size="16" font-style="italic" text-anchor="middle">Vite &amp; Gourmand</text>
  <text x="720" y="1122" fill="#E8D5D0" font-size="13" text-anchor="middle">Bordeaux — depuis 25 ans</text>
  <text x="1380" y="1098" fill="#E8D5D0" font-size="13" text-anchor="end">Mentions légales</text>
  <text x="1380" y="1122" fill="#E8D5D0" font-size="13" text-anchor="end">Conditions générales de vente</text>
</svg>
