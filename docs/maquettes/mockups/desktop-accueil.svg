<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2D2A26" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .txt   { fill: #2D2A26; }
    .mut   { fill: #6B645C; }
    .blanc { fill: #FFFFFF; }
  </style>

  <!-- Fond de page -->
  <rect width="1440" height="1180" fill="#FAF4EA"/>

  <!-- ===== HEADER ===== -->
  <rect width="1440" height="80" fill="#7B2D35"/>
  <text x="60" y="50" class="serif blanc" font-size="26" font-style="italic" font-weight="bold">Vite &amp; Gourmand</text>
  <text x="950" y="48" class="blanc" font-size="16" font-weight="bold">Accueil</text>
  <rect x="945" y="58" width="55" height="3" fill="#C99B3F"/>
  <text x="1050" y="48" class="blanc" font-size="16">Nos menus</text>
  <text x="1175" y="48" class="blanc" font-size="16">Contact</text>
  <rect x="1265" y="22" width="120" height="38" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="1325" y="46" class="blanc" font-size="15" text-anchor="middle">Connexion</text>

  <!-- ===== HERO ===== -->
  <text x="60" y="185" class="serif txt" font-size="44" font-weight="bold">Traiteur événementiel</text>
  <text x="60" y="240" class="serif" font-size="44" font-weight="bold" fill="#7B2D35">à Bordeaux depuis 25 ans</text>
  <text x="60" y="290" class="mut" font-size="18">Julie et José composent pour vous des menus de saison,</text>
  <text x="60" y="318" class="mut" font-size="18">pour tous vos événements : Noël, Pâques, mariages, réceptions…</text>
  <rect x="60" y="360" width="250" height="52" rx="8" fill="#7B2D35"/>
  <text x="185" y="393" class="blanc" font-size="17" font-weight="bold" text-anchor="middle">Découvrir nos menus</text>
  <!-- Visuel hero -->
  <rect x="800" y="120" width="580" height="320" rx="12" fill="#EAD9C2" filter="url(#sh)"/>
  <circle cx="1090" cy="265" r="80" fill="#FAF4EA" stroke="#C99B3F" stroke-width="3"/>
  <circle cx="1090" cy="265" r="58" fill="#FFFFFF" stroke="#E4CFA6" stroke-width="2"/>
  <text x="1090" y="420" class="mut" font-size="13" text-anchor="middle" font-style="italic">Photo — plat signature</text>

  <!-- ===== SECTION ÉQUIPE ===== -->
  <rect y="480" width="1440" height="300" fill="#FFFFFF"/>
  <text x="720" y="545" class="serif txt" font-size="32" font-weight="bold" text-anchor="middle">Une équipe de passionnés</text>
  <rect x="670" y="560" width="100" height="3" fill="#C99B3F"/>
  <!-- Carte 1 -->
  <rect x="150" y="595" width="340" height="150" rx="12" fill="#FAF4EA" filter="url(#sh)"/>
  <circle cx="320" cy="640" r="24" fill="#C99B3F"/>
  <text x="320" y="647" font-size="20" text-anchor="middle" fill="#FFFFFF">25</text>
  <text x="320" y="695" class="txt" font-size="17" font-weight="bold" text-anchor="middle">25 ans d'expérience</text>
  <text x="320" y="720" class="mut" font-size="14" text-anchor="middle">Un savoir-faire reconnu à Bordeaux</text>
  <!-- Carte 2 -->
  <rect x="550" y="595" width="340" height="150" rx="12" fill="#FAF4EA" filter="url(#sh)"/>
  <circle cx="700" cy="640" r="24" fill="#7B2D35"/>
  <circle cx="740" cy="640" r="24" fill="#7B2D35" opacity="0.7"/>
  <text x="720" y="695" class="txt" font-size="17" font-weight="bold" text-anchor="middle">Julie &amp; José</text>
  <text x="720" y="720" class="mut" font-size="14" text-anchor="middle">Un duo complice, en cuisine comme en salle</text>
  <!-- Carte 3 -->
  <rect x="950" y="595" width="340" height="150" rx="12" fill="#FAF4EA" filter="url(#sh)"/>
  <circle cx="1120" cy="640" r="24" fill="#2E7D32"/>
  <text x="1120" y="648" font-size="20" text-anchor="middle" fill="#FFFFFF">✓</text>
  <text x="1120" y="695" class="txt" font-size="17" font-weight="bold" text-anchor="middle">Produits frais et locaux</text>
  <text x="1120" y="720" class="mut" font-size="14" text-anchor="middle">Menus de saison en constante évolution</text>

  <!-- ===== SECTION AVIS ===== -->
  <text x="720" y="855" class="serif txt" font-size="32" font-weight="bold" text-anchor="middle">Ils nous font confiance</text>
  <rect x="670" y="870" width="100" height="3" fill="#C99B3F"/>
  <!-- Avis 1 -->
  <rect x="150" y="900" width="340" height="160" rx="12" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="175" y="935" font-size="18" fill="#C99B3F">★★★★★</text>
  <text x="175" y="968" class="txt" font-size="14">« Menu de Noël parfait, nos invités en</text>
  <text x="175" y="988" class="txt" font-size="14">parlent encore. Merci Julie et José ! »</text>
  <text x="175" y="1030" class="mut" font-size="13" font-weight="bold">Claire D. — Bordeaux</text>
  <!-- Avis 2 -->
  <rect x="550" y="900" width="340" height="160" rx="12" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="575" y="935" font-size="18" fill="#C99B3F">★★★★★</text>
  <text x="575" y="968" class="txt" font-size="14">« Livraison ponctuelle, plats délicieux,</text>
  <text x="575" y="988" class="txt" font-size="14">rapport qualité-prix imbattable. »</text>
  <text x="575" y="1030" class="mut" font-size="13" font-weight="bold">Marc L. — Mérignac</text>
  <!-- Avis 3 -->
  <rect x="950" y="900" width="340" height="160" rx="12" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="975" y="935" font-size="18" fill="#C99B3F">★★★★☆</text>
  <text x="975" y="968" class="txt" font-size="14">« Le menu végétarien a conquis toute</text>
  <text x="975" y="988" class="txt" font-size="14">la tablée. Nous recommandons ! »</text>
  <text x="975" y="1030" class="mut" font-size="13" font-weight="bold">Sophie R. — Pessac</text>

  <!-- ===== FOOTER ===== -->
  <rect y="1090" width="1440" height="90" fill="#5E2129"/>
  <text x="60" y="1128" class="blanc" font-size="14" font-weight="bold">Horaires</text>
  <text x="60" y="1152" fill="#E8D5D0" font-size="13">Lun – Ven : 9h – 19h · Sam : 9h – 20h · Dim : 10h – 16h</text>
  <text x="720" y="1128" class="serif blanc" font-size="16" font-style="italic" text-anchor="middle">Vite &amp; Gourmand</text>
  <text x="720" y="1152" fill="#E8D5D0" font-size="13" text-anchor="middle">Bordeaux — depuis 25 ans</text>
  <text x="1380" y="1128" fill="#E8D5D0" font-size="13" text-anchor="end">Mentions légales</text>
  <text x="1380" y="1152" fill="#E8D5D0" font-size="13" text-anchor="end">Conditions générales de vente</text>
</svg>
