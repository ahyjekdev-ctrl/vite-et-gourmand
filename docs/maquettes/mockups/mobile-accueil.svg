<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1300" viewBox="0 0 375 1300" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2D2A26" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .txt   { fill: #2D2A26; }
    .mut   { fill: #6B645C; }
    .blanc { fill: #FFFFFF; }
  </style>

  <rect width="375" height="1300" fill="#FAF4EA"/>

  <!-- ===== HEADER MOBILE ===== -->
  <rect width="375" height="64" fill="#7B2D35"/>
  <!-- Burger -->
  <rect x="20" y="24" width="24" height="3" rx="1.5" fill="#FFFFFF"/>
  <rect x="20" y="31" width="24" height="3" rx="1.5" fill="#FFFFFF"/>
  <rect x="20" y="38" width="24" height="3" rx="1.5" fill="#FFFFFF"/>
  <text x="187" y="40" class="serif blanc" font-size="18" font-style="italic" font-weight="bold" text-anchor="middle">Vite &amp; Gourmand</text>
  <!-- Icône compte -->
  <circle cx="343" cy="28" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 331 45 Q 343 34 355 45" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- ===== HERO ===== -->
  <text x="187" y="120" class="serif txt" font-size="26" font-weight="bold" text-anchor="middle">Traiteur événementiel</text>
  <text x="187" y="152" class="serif" font-size="26" font-weight="bold" fill="#7B2D35" text-anchor="middle">à Bordeaux</text>
  <text x="187" y="185" class="mut" font-size="14" text-anchor="middle">Depuis 25 ans, Julie et José composent</text>
  <text x="187" y="205" class="mut" font-size="14" text-anchor="middle">des menus pour tous vos événements.</text>
  <rect x="27" y="230" width="321" height="180" rx="12" fill="#EAD9C2" filter="url(#sh)"/>
  <circle cx="187" cy="315" r="48" fill="#FAF4EA" stroke="#C99B3F" stroke-width="2.5"/>
  <circle cx="187" cy="315" r="34" fill="#FFFFFF" stroke="#E4CFA6" stroke-width="2"/>
  <rect x="27" y="435" width="321" height="50" rx="8" fill="#7B2D35"/>
  <text x="187" y="466" class="blanc" font-size="16" font-weight="bold" text-anchor="middle">Découvrir nos menus</text>

  <!-- ===== ÉQUIPE ===== -->
  <rect y="520" width="375" height="360" fill="#FFFFFF"/>
  <text x="187" y="570" class="serif txt" font-size="22" font-weight="bold" text-anchor="middle">Une équipe de passionnés</text>
  <rect x="147" y="583" width="80" height="3" fill="#C99B3F"/>
  <rect x="27" y="605" width="321" height="115" rx="12" fill="#FAF4EA" filter="url(#sh)"/>
  <circle cx="187" cy="642" r="18" fill="#C99B3F"/>
  <text x="187" y="648" font-size="14" text-anchor="middle" fill="#FFFFFF">25</text>
  <text x="187" y="683" class="txt" font-size="15" font-weight="bold" text-anchor="middle">25 ans d'expérience</text>
  <text x="187" y="704" class="mut" font-size="12" text-anchor="middle">Un savoir-faire reconnu à Bordeaux</text>
  <rect x="27" y="735" width="321" height="115" rx="12" fill="#FAF4EA" filter="url(#sh)"/>
  <circle cx="172" cy="772" r="18" fill="#7B2D35"/>
  <circle cx="202" cy="772" r="18" fill="#7B2D35" opacity="0.7"/>
  <text x="187" y="813" class="txt" font-size="15" font-weight="bold" text-anchor="middle">Julie &amp; José</text>
  <text x="187" y="834" class="mut" font-size="12" text-anchor="middle">Un duo complice depuis toujours</text>

  <!-- ===== AVIS ===== -->
  <text x="187" y="930" class="serif txt" font-size="22" font-weight="bold" text-anchor="middle">Ils nous font confiance</text>
  <rect x="147" y="943" width="80" height="3" fill="#C99B3F"/>
  <rect x="27" y="965" width="321" height="130" rx="12" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="50" y="998" font-size="16" fill="#C99B3F">★★★★★</text>
  <text x="50" y="1028" class="txt" font-size="13">« Menu de Noël parfait, nos invités</text>
  <text x="50" y="1046" class="txt" font-size="13">en parlent encore. Merci ! »</text>
  <text x="50" y="1075" class="mut" font-size="12" font-weight="bold">Claire D. — Bordeaux</text>
  <!-- Points de carrousel -->
  <circle cx="167" cy="1120" r="4" fill="#7B2D35"/>
  <circle cx="187" cy="1120" r="4" fill="#D8CFC2"/>
  <circle cx="207" cy="1120" r="4" fill="#D8CFC2"/>

  <!-- ===== FOOTER ===== -->
  <rect y="1150" width="375" height="150" fill="#5E2129"/>
  <text x="27" y="1185" class="blanc" font-size="13" font-weight="bold">Horaires</text>
  <text x="27" y="1207" fill="#E8D5D0" font-size="12">Lun – Ven : 9h – 19h · Sam : 9h – 20h</text>
  <text x="27" y="1225" fill="#E8D5D0" font-size="12">Dim : 10h – 16h</text>
  <text x="27" y="1255" fill="#E8D5D0" font-size="12" text-decoration="underline">Mentions légales</text>
  <text x="27" y="1278" fill="#E8D5D0" font-size="12" text-decoration="underline">Conditions générales de vente</text>
</svg>
